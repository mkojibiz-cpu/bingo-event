    <g stroke="#cfcabb" stroke-width="1">
      <line x1="66" y1="0" x2="66" y2="56"/><line x1="132" y1="0" x2="132" y2="56"/>
      <line x1="198" y1="0" x2="198" y2="56"/><line x1="264" y1="0" x2="264" y2="56"/>
      <line x1="330" y1="0" x2="330" y2="56"/><line x1="396" y1="0" x2="396" y2="56"/>
      <line x1="462" y1="0" x2="462" y2="56"/><line x1="528" y1="0" x2="528" y2="56"/>
      <line x1="594" y1="0" x2="594" y2="56"/><line x1="660" y1="0" x2="660" y2="56"/>
      <line x1="726" y1="0" x2="726" y2="56"/><line x1="792" y1="0" x2="792" y2="56"/>
