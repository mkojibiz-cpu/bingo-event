<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="びんごイベントナビ">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0e6"/>
      <stop offset="0.42" stop-color="#8fb3bc"/>
      <stop offset="1" stop-color="#2f6f7c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#1c3a4b"/>
  <rect x="0" y="0" width="1200" height="250" fill="url(#sea)"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- 発着案内板ふうのパネル -->
  <rect x="72" y="150" width="1056" height="360" fill="#f3f1ea" stroke="#d7d3c6" stroke-width="2"/>

  <text x="104" y="214" font-family="'DejaVu Sans Mono',monospace" font-size="24" letter-spacing="8" fill="#2f7d84">BINGO AREA / EVENT TIMETABLE</text>

  <text x="102" y="300" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="76" font-weight="700" fill="#1c3a4b">びんごイベントナビ</text>

  <text x="106" y="356" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="30" fill="#4b6675">福山・笠岡・尾道・府中・神辺のイベントを毎日更新</text>

  <!-- 月バーふうの目盛 -->
  <g transform="translate(104,404)">
