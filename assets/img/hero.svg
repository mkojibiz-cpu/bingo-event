<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-label="福山城とばら、提灯のキービジュアル">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0c4"/>
      <stop offset="0.42" stop-color="#ffc0d4"/>
      <stop offset="0.72" stop-color="#a9cfe9"/>
      <stop offset="1" stop-color="#c7e4f0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.5" stop-color="#ffe9c4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbcd6"/>
      <stop offset="1" stop-color="#6a9cbd"/>
    </linearGradient>
  </defs>

  <!-- 空 -->
  <rect width="1600" height="460" fill="url(#sky)"/>
  <circle cx="1200" cy="150" r="240" fill="url(#sun)"/>
  <circle cx="1200" cy="150" r="52" fill="#fff2d2"/>

  <!-- 遠景の山 -->
  <path d="M0 320 L180 250 L360 305 L560 235 L760 300 L980 240 L1220 300 L1440 250 L1600 300 L1600 460 L0 460 Z" fill="#a9c5d8"/>
  <path d="M0 350 L220 300 L470 345 L720 295 L1000 350 L1280 300 L1600 345 L1600 460 L0 460 Z" fill="#88a9c1"/>

  <!-- 手前の丘 -->
  <path d="M0 392 C 260 356, 520 372, 800 372 C 1080 372, 1340 356, 1600 392 L1600 460 L0 460 Z" fill="#6f9a76"/>
  <path d="M0 430 C 300 410, 560 430, 900 424 C 1200 419, 1400 432, 1600 428 L1600 460 L0 460 Z" fill="#5e8867"/>

  <!-- 川 -->
  <path d="M120 404 C 380 392, 520 420, 800 414 C 1040 409, 1180 400, 1420 408 L1440 434 C 1180 442, 980 430, 760 436 C 520 442, 360 430, 140 436 Z" fill="url(#river)" opacity="0.9"/>

  <!-- 福山城 -->
  <g>
    <rect x="716" y="352" width="168" height="14" fill="#b7af9e"/>
    <!-- 1層 -->
    <rect x="726" y="300" width="148" height="54" fill="#f4f1ea"/>
    <rect x="742" y="316" width="20" height="24" fill="#3c4a55"/>
    <rect x="838" y="316" width="20" height="24" fill="#3c4a55"/>
    <polygon points="708,302 892,302 866,276 734,276" fill="#42566a"/>
    <polygon points="708,302 700,296 720,290 734,276" fill="#42566a"/>
    <polygon points="892,302 900,296 880,290 866,276" fill="#42566a"/>
    <!-- 2層 -->
    <rect x="746" y="248" width="108" height="30" fill="#f4f1ea"/>
    <rect x="784" y="256" width="32" height="20" fill="#3c4a55"/>
    <polygon points="732,250 868,250 848,226 752,226" fill="#42566a"/>
    <polygon points="732,250 724,244 742,240 752,226" fill="#42566a"/>
    <polygon points="868,250 876,244 858,240 848,226" fill="#42566a"/>
    <!-- 3層 -->
    <rect x="764" y="200" width="72" height="28" fill="#f4f1ea"/>
    <rect x="790" y="206" width="20" height="18" fill="#3c4a55"/>
    <polygon points="752,202 848,202 830,180 770,180" fill="#42566a"/>
    <polygon points="752,202 745,197 760,193 770,180" fill="#42566a"/>
    <polygon points="848,202 855,197 840,193 830,180" fill="#42566a"/>
    <!-- 鯱 -->
    <path d="M772 180 q4 -12 12 -12 q-4 8 -2 12 Z" fill="#e6c05c"/>
    <path d="M828 180 q-4 -12 -12 -12 q4 8 2 12 Z" fill="#e6c05c"/>
  </g>

  <!-- 提灯 -->
  <g>
    <path d="M110 66 Q 320 40 540 96" fill="none" stroke="#7c4a2c" stroke-width="3"/>
    <g fill="#ff8f3c">
      <g transform="translate(150,66)"><rect x="-4" y="-14" width="8" height="6" fill="#6b3f22"/><ellipse cx="0" cy="4" rx="14" ry="18"/><ellipse cx="-4" cy="-2" rx="4" ry="7" fill="#ffd9a8"/><rect x="-4" y="20" width="8" height="6" fill="#6b3f22"/></g>
      <g transform="translate(226,58)"><rect x="-4" y="-14" width="8" height="6" fill="#6b3f22"/><ellipse cx="0" cy="4" rx="14" ry="18"/><ellipse cx="-4" cy="-2" rx="4" ry="7" fill="#ffd9a8"/><rect x="-4" y="20" width="8" height="6" fill="#6b3f22"/></g>
      <g transform="translate(310,58)"><rect x="-4" y="-14" width="8" height="6" fill="#6b3f22"/><ellipse cx="0" cy="4" rx="14" ry="18"/><ellipse cx="-4" cy="-2" rx="4" ry="7" fill="#ffd9a8"/><rect x="-4" y="20" width="8" height="6" fill="#6b3f22"/></g>
      <g transform="translate(396,66)"><rect x="-4" y="-14" width="8" height="6" fill="#6b3f22"/><ellipse cx="0" cy="4" rx="14" ry="18"/><ellipse cx="-4" cy="-2" rx="4" ry="7" fill="#ffd9a8"/><rect x="-4" y="20" width="8" height="6" fill="#6b3f22"/></g>
      <g transform="translate(482,82)"><rect x="-4" y="-14" width="8" height="6" fill="#6b3f22"/><ellipse cx="0" cy="4" rx="14" ry="18"/><ellipse cx="-4" cy="-2" rx="4" ry="7" fill="#ffd9a8"/><rect x="-4" y="20" width="8" height="6" fill="#6b3f22"/></g>
    </g>
  </g>

  <!-- ばら（左） -->
  <g transform="translate(150,392)">
    <path d="M20 60 C 10 24, -10 10, -24 -6" stroke="#4f7d5a" stroke-width="5" fill="none"/>
    <path d="M40 60 C 44 30, 60 16, 78 4" stroke="#4f7d5a" stroke-width="5" fill="none"/>
    <path d="M30 62 C 30 34, 34 16, 30 -4" stroke="#4f7d5a" stroke-width="6" fill="none"/>
    <ellipse cx="-6" cy="24" rx="16" ry="8" fill="#579066" transform="rotate(-28 -6 24)"/>
    <ellipse cx="58" cy="30" rx="16" ry="8" fill="#579066" transform="rotate(26 58 30)"/>
    <g><circle cx="-24" cy="-8" r="17" fill="#df4870"/><circle cx="-24" cy="-8" r="11" fill="#ec6d8c"/><circle cx="-24" cy="-8" r="5" fill="#f8b6c7"/></g>
    <g><circle cx="30" cy="-8" r="19" fill="#d63f66"/><circle cx="30" cy="-8" r="12" fill="#ea6285"/><circle cx="30" cy="-8" r="5" fill="#f8b6c7"/></g>
    <g><circle cx="80" cy="2" r="15" fill="#df4870"/><circle cx="80" cy="2" r="9" fill="#ec6d8c"/><circle cx="80" cy="2" r="4" fill="#f8b6c7"/></g>
  </g>

  <!-- ばら（右） -->
  <g transform="translate(1330,388)">
    <path d="M20 64 C 12 30, -6 16, -22 2" stroke="#4f7d5a" stroke-width="5" fill="none"/>
    <path d="M42 64 C 48 32, 66 18, 86 6" stroke="#4f7d5a" stroke-width="5" fill="none"/>
    <path d="M32 66 C 32 36, 36 16, 32 -6" stroke="#4f7d5a" stroke-width="6" fill="none"/>
    <ellipse cx="-4" cy="26" rx="17" ry="8" fill="#579066" transform="rotate(-26 -4 26)"/>
    <ellipse cx="64" cy="32" rx="17" ry="8" fill="#579066" transform="rotate(24 64 32)"/>
    <g><circle cx="-22" cy="-10" r="18" fill="#d63f66"/><circle cx="-22" cy="-10" r="11" fill="#ea6285"/><circle cx="-22" cy="-10" r="5" fill="#f8b6c7"/></g>
    <g><circle cx="34" cy="-12" r="21" fill="#df4870"/><circle cx="34" cy="-12" r="13" fill="#ec6d8c"/><circle cx="34" cy="-12" r="6" fill="#f8b6c7"/></g>
    <g><circle cx="88" cy="0" r="16" fill="#d63f66"/><circle cx="88" cy="0" r="10" fill="#ea6285"/><circle cx="88" cy="0" r="4" fill="#f8b6c7"/></g>
  </g>

  <!-- 舞う光の粒 -->
  <g fill="#fff7df">
    <circle cx="620" cy="120" r="4" opacity="0.9"/>
    <circle cx="700" cy="80" r="3" opacity="0.8"/>
    <circle cx="900" cy="110" r="3" opacity="0.75"/>
    <circle cx="1020" cy="70" r="4" opacity="0.85"/>
    <circle cx="560" cy="180" r="2.5" opacity="0.7"/>
    <circle cx="1120" cy="200" r="3" opacity="0.7"/>
  </g>

  <!-- ガーランド旗 -->
  <line x1="0" y1="24" x2="1600" y2="24" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <g>
    <polygon points="40,24 76,24 58,52" fill="#e2496f"/>
    <polygon points="112,24 148,24 130,52" fill="#f4c94e"/>
    <polygon points="184,24 220,24 202,52" fill="#6aa9c9"/>
    <polygon points="1384,24 1420,24 1402,52" fill="#e2496f"/>
    <polygon points="1456,24 1492,24 1474,52" fill="#f4c94e"/>
    <polygon points="1528,24 1564,24 1546,52" fill="#6aa9c9"/>
  </g>
</svg>
