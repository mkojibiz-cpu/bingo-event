<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="canonical" href="https://bingo-event.com/">
  <meta name="theme-color" content="#1c3a4b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="びんごイベントナビ">
  <meta property="og:title" content="びんごイベントナビ｜備後・福山エリアのイベント情報">
  <meta property="og:description" content="福山・笠岡・尾道・府中・神辺のイベント情報を毎日更新でまとめています。">
  <meta property="og:url" content="https://bingo-event.com/">
  <meta property="og:image" content="https://bingo-event.com/assets/img/ogp.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="index.html">
        <span class="site-logo__mark" aria-hidden="true"></span>
        びんごイベントナビ<span class="site-logo__beta">（仮）</span>
      </a>
      <p class="site-tagline">FUKUYAMA / KASAOKA / ONOMICHI / FUCHU / KANNABE</p>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- 海の帯＋時刻表パネル -->
      <section class="tt-hero">
        <div class="tt-hero__panel">
          <p class="tt-hero__eyebrow">BINGO AREA &nbsp;/&nbsp; EVENT TIMETABLE</p>
          <h1 class="tt-hero__title">備後・福山エリアのイベント発着案内</h1>
          <p class="tt-hero__sub">お祭り・花火・展示・マルシェを毎日更新<span id="heroCount"></span></p>
          <div class="tt-monthbar" id="monthbar" aria-hidden="true">
            <span class="tt-monthbar__caption" id="monthbarCaption"></span>
          </div>
        </div>
      </section>

      <!-- 新着イベント（電光掲示板） -->
      <section class="section">
        <h2 class="section__title">新着イベント <span class="section__note">最近見つかった情報</span></h2>
        <div class="tt-board" id="featured"></div>
      </section>

      <!-- エリアフィルタ + 一覧 -->
      <section class="section">
        <h2 class="section__title">すべてのイベント <span class="section__note">開催が近い順</span></h2>
        <div class="filter" id="filter"></div>
        <div class="tt-grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="ページ送り"></nav>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__note">
        掲載情報は各主催者・自治体・観光協会などの公開情報をもとにまとめています。
        日時・料金などは変更される場合があります。最新・正確な情報は各イベントのリンク先をご確認ください。<br>
        <a href="submit.html">イベント情報の掲載・修正依頼はこちら</a>
      </p>
      <p class="site-footer__copy">© 2026 びんごイベントナビ</p>
    </div>
  </footer>

  <script src="data/events.js"></script>
  <script src="assets/js/list.js"></script>
