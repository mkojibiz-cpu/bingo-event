name: Daily crawl

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 06:00 JST（毎日）
  workflow_dispatch:        # 手動実行も可

# GITHUB_TOKEN による push は他ワークフローを起動しないため、
# このワークフロー内でクロール → コミット → デプロイまで行う。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci

      - name: Run crawler
        working-directory: crawler
        run: node run.js

      - name: Commit updated data if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/events.js sitemap.xml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.js sitemap.xml
            git commit -m "chore(data): daily crawl update ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # crawl ジョブが push した最新を取得

      - name: Stage site files (exclude crawler / meta)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='crawler' --exclude='design' --exclude='node_modules' \
            --exclude='README.md' --exclude='.gitignore' --exclude='.gitattributes' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
